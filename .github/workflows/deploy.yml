name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - run: bun install

      - run: bun run build

      - name: Create wrangler.toml
        run: |
          printf '[[kv_namespaces]]\nbinding = "SITE"\nid = "%s"\n' "$KV_NAMESPACE_ID" > wrangler.toml
        env:
          KV_NAMESPACE_ID: ${{ secrets.KV_NAMESPACE_ID }}

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: kv bulk put --namespace-id ${{ secrets.KV_NAMESPACE_ID }} --remote dist/kv-entries.json
