name: Refresh Code Section

on:
  schedule:
    - cron: "0 8,20 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: 22
          cache: true

      - run: vp run subset:fonts

      - name: Build site with live GitHub feed
        id: build
        shell: bash
        run: vp exec astro build 2>&1 | tee "$RUNNER_TEMP/code-feed-build.log"
        env:
          GH_PROFILE_TOKEN: ${{ secrets.GH_PROFILE_TOKEN }}
          CODE_FEED_REQUIRE_LIVE: "true"

      - name: Deploy site
        id: deploy
        run: vp exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Report code feed and deployment
        if: ${{ always() }}
        run: node tools/report-code-feed.mjs "$RUNNER_TEMP/code-feed-build.log"
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
